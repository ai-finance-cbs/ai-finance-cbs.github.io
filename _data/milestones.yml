- number: 1
  title: Pre-Class Survey
  description: "Answer a few questions about where you want to work, which AI tools you use and how often, and the most useful thing you have done with AI."
  deliverable: Canvas survey.
  grading: Completion.
- number: 2
  title: Proposal and Task Map
  description: "Say what you want to build, who in your intended role would use it, and why it is worth building. Break the work into the steps somebody performs today. Label each step Process, Predict, Persuade, or Position."
  deliverable: One-page PDF with the proposal and the labelled list of steps.
  grading: Clarity of the proposal and realism of the steps.
- number: 3
  title: Working Setup
  description: "Build the smallest version that works. It should take a real input, implement the core task, and produce an output. It can be crude and narrow."
  deliverable: "A short description and proof that it ran: a screen recording, a screenshot of input beside output, or other evidence of it working."
  grading: Evidence of a run and clarity of the description.
- number: 4
  title: Personal Benchmark
  description: "Assemble real test cases. Establish the right answer for each from the source, write down a scoring rule, and name the baseline you are trying to beat. Do not run your tool on these cases yet."
  deliverable: Cases with answers and sources, a scoring rule, and a baseline.
  grading: Verifiable answers, a usable scoring rule, and an honest baseline.
- number: 5
  title: Pitch It
  description: Write the one-page memo making the case for your tool.
  deliverable: One-page memo.
  grading: Clarity of the case and support for claims.
