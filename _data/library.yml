# Library sections: Prelude, one per week, then Coda.
# "kicker" is the small label shown above the page title and in the Library list.
# "slug" is the web address: /library/<slug>/
# "topics" are short names for the syllabus topics, in the same order as _data/weeks.yml.
# In _data/materials.yml, "topic" must match one of these short names.
- title: Prelude
  slug: prelude
  week: 0
  kicker: Before Week 1
  topics: ["Where Do AI Answers Come From?", Best Practices]
- title: AI Economics
  slug: economics-of-ai
  week: 1
  kicker: Week 1
  topics: [Economic Frameworks for AI, Bulls vs. Skeptics, Nature of Financial Work]
- title: AI Infrastructure
  slug: ai-infrastructure
  week: 2
  kicker: Week 2
  topics: [Compute, Models, Data and Context, Tools and Agents]
- title: Processing Information
  slug: processing-information
  week: 3
  kicker: Week 3
  topics: [Data Sources, Data Preparation, Retrieval and Analysis, Verification]
- title: Predicting Outcomes
  slug: predicting-outcomes
  week: 4
  kicker: Week 4
  topics: [Prediction Basics, Predicting Fundamentals, Predicting People, Contamination and Cutoffs, Confidence and Instability]
- title: Persuading Stakeholders
  slug: persuading-stakeholders
  week: 5
  kicker: Week 5
  topics: [Modes of Communication, AI-Assisted Drafting, Models as Readers, Artifact Handover, Defending the Analysis]
- title: Future of Finance
  slug: future-of-finance
  week: 6
  kicker: Week 6
  topics: [Markets, People, Firms, Position]
- title: Coda
  slug: coda
  week: 99          # not tied to a class week
  kicker: Beyond the Syllabus
  topics: [Further Materials]
