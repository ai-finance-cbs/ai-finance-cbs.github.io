# Milestone #2 role task lists. Source: O*NET 30.1 task statements, trimmed and lightly edited.
# Each task keeps its O*NET task ID so the edit can be traced back to the original.
- slug: investment-banking
  title: Investment Banking
  onet_code: "13-2051.00"
  onet_title: Financial and Investment Analysts
  summary: >-
    Investment bankers advise companies on raising capital, buying and selling businesses, and
    restructuring their finances. Junior bankers spend most of their time on models, valuation,
    and the presentations that carry a deal from pitch to close.
  tasks:
    - name: Capital structure advice
      description: Advise clients on how much capital to raise, from which sources, and when.
      onet_id: 21579
    - name: Structuring a financing
      description: Assess a client's capital needs and current market conditions to design a financing package.
      onet_id: 21592
    - name: Restructuring and refinancing
      description: Work with clients to restructure existing debt, refinance it, or raise new debt.
      onet_id: 21585
    - name: Distressed company analysis
      description: Analyze the financial and operating performance of companies in financial difficulty and recommend remedies.
      onet_id: 21580
    - name: Financial modeling
      description: Build financial models to solve financial problems or to estimate the financial and capital impact of a transaction.
      onet_id: 21590
    - name: Valuation
      description: Value a company or its securities.
      onet_id: 21597
    - name: Pricing an offering
      description: Determine the price at which securities should be syndicated and offered to the public.
      onet_id: 21587
    - name: Comparable company analysis
      description: Evaluate and compare the relative quality of securities and companies within an industry.
      onet_id: 21591
    - name: Industry and market research
      description: Track economic, industry, and company developments using financial publications, data services, government sources, company filings, and interviews.
      onet_id: 21596
    - name: Charts and exhibits
      description: Build charts, graphs, and tables in spreadsheets to illustrate analyses and reports.
      onet_id: 21589
    - name: Client presentations
      description: Create client presentations, such as pitch books and deal proposals.
      onet_id: 21586
    - name: Deal execution materials
      description: Prepare the materials needed to execute a transaction, from data rooms to offering documents.
      onet_id: 21598
    - name: Client relationships and origination
      description: Develop and maintain client relationships and help win new corporate clients.
      onet_id: 21588
    - name: Coordinating advisors
      description: Work with lawyers, accountants, and public relations advisors on a deal.
      onet_id: 21582
    - name: Training junior bankers
      description: Supervise, train, and mentor junior team members.
      onet_id: 21604
