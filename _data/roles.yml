# Milestone #2 worked examples (completed task maps). Source: O*NET 30.1 task statements, trimmed and rewritten as concrete tasks.
# Each task keeps its O*NET task ID so the edit can be traced back to the original.
- slug: investment-banking
  title: Investment Banking
  onet_code: "13-2051.00"
  onet_title: Financial and Investment Analysts
  summary: >-
    Investment bankers advise companies on raising capital, buying and selling businesses, and
    restructuring their finances. Junior bankers spend most of their time on models, valuation,
    and the presentations that carry a deal from pitch to close.
  tasks:
    - name: Capital structure advice
      description: Recommend how much capital the client should raise, from which sources, and when, and stand behind that advice.
      onet_id: 21579
      label: Own
    - name: Sizing the financing
      description: Estimate how much capital the client will need and how investors are likely to react to different deal structures.
      onet_id: 21592
      label: Predict
    - name: Restructuring negotiations
      description: Negotiate new terms with lenders on behalf of a client that must restructure or refinance its debt.
      onet_id: 21585
      label: Persuade
    - name: Distressed company review
      description: Pull debt maturities, covenants, and cash balances out of a struggling company's filings into one summary.
      onet_id: 21580
      label: Process
    - name: Financial modeling
      description: Forecast revenue, cash flow, and leverage in a three-statement model of the company after the deal.
      onet_id: 21590
      label: Predict
    - name: Valuation
      description: Estimate what the company is worth using discounted cash flows and trading multiples.
      onet_id: 21597
      label: Predict
    - name: Pricing an offering
      description: Decide with the client on the final price of a stock or bond offering, the night before it launches.
      onet_id: 21587
      label: Own
    - name: Comparable company analysis
      description: Collect financials and trading multiples for peer companies into a comps table.
      onet_id: 21591
      label: Process
    - name: Industry research
      description: Gather and summarize filings, news, and market data on an industry.
      onet_id: 21596
      label: Process
    - name: Charts and exhibits
      description: Design the charts that make a deal's main point clear at a glance.
      onet_id: 21589
      label: Persuade
    - name: Pitch books
      description: Draft the presentation that convinces a client to hire the bank.
      onet_id: 21586
      label: Persuade
    - name: Data room review
      description: Find every contract in the data room with a change-of-control clause and log it.
      onet_id: 21598
      label: Process
    - name: Client relationships
      description: Be the banker the CEO calls first, and own the relationship over many years.
      onet_id: 21588
      label: Own
    - name: Coordinating advisors
      description: Keep lawyers, accountants, and PR advisors aligned on the deal message and timeline.
      onet_id: 21582
      label: Persuade
    - name: Supervising juniors
      description: Review junior bankers' work and take responsibility for everything that leaves the team.
      onet_id: 21604
      label: Own
- slug: management-consulting
  title: Management Consulting
  onet_code: "13-1111.00"
  onet_title: Management Analysts
  summary: >-
    Management consultants help companies solve business problems, from cutting costs to entering
    new markets. Junior consultants gather and analyze data, build the slides, and keep the client
    team moving toward a decision.
  tasks:
    - name: Interview synthesis
      description: Turn notes from fifteen client and expert interviews into a summary of the main themes.
      onet_id: 7281
      label: Process
    - name: Data collection
      description: Collect the client's sales and cost data from several systems and clean it into one workbook.
      onet_id: 7276
      label: Process
    - name: Benchmarking
      description: Compare the client's costs with those of five peer companies using public filings and industry reports.
      onet_id: 7280
      label: Process
    - name: Market sizing
      description: Estimate the size of the client's addressable market from public data and stated assumptions.
      onet_id: 7277
      label: Predict
    - name: Business case
      description: Forecast the savings from a proposed change in the client's operations over the next three years.
      onet_id: 7277
      label: Predict
    - name: Storyline
      description: Write the one-sentence headline for each slide of the steering committee deck.
      onet_id: 7282
      label: Persuade
    - name: Slide production
      description: Turn the analysis into slides that lead the client step by step to the recommendation.
      onet_id: 7282
      label: Persuade
    - name: Client workshop
      description: Run a workshop that gets the client's managers to agree on the new process.
      onet_id: 7278
      label: Persuade
    - name: Choosing the recommendation
      description: Decide which of three options the team recommends, and defend that choice to the partner.
      label: Own
    - name: Day-to-day client contact
      description: Be the person on the team the client's project lead trusts and calls first.
      label: Own
    - name: Implementation follow-through
      description: Answer for whether the new process actually works once the client launches it.
      onet_id: 7278
      label: Own
- slug: corporate-finance
  title: Corporate Finance (FP&A)
  onet_code: "13-2031.00 and 11-3031.01"
  onet_title: Budget Analysts; Treasurers and Controllers
  summary: >-
    Financial planning and analysis (FP&A) teams sit inside a company's finance function. They build
    the budget, track results against it, forecast the rest of the year, and help the CFO decide
    where money goes.
  tasks:
    - name: Budget-versus-actual report
      description: Pull monthly actuals from the accounting system into the budget-versus-actual report.
      onet_id: 3394
      label: Process
    - name: Variance explanations
      description: Find the cause of every line where spending missed budget by more than 5%, using department records.
      onet_id: 3394
      label: Process
    - name: Budget consolidation
      description: Combine department budget submissions into one company budget and check them for errors.
      onet_id: 3402
      label: Process
    - name: Rolling forecast
      description: Update the full-year revenue, profit, and cash forecast each quarter.
      onet_id: 8856
      label: Predict
    - name: Capital request review
      description: Estimate the payback period and net present value of a department's request for new equipment.
      onet_id: 3403
      label: Predict
    - name: Scenario planning
      description: Model how earnings change if prices fall 10% or the largest customer leaves.
      onet_id: 8867
      label: Predict
    - name: Board presentation
      description: Prepare the CFO's slides on quarterly results and outlook for the board.
      onet_id: 8856
      label: Persuade
    - name: Budget negotiations
      description: Get department heads to bring their budget requests in line with company targets.
      onet_id: 3396
      label: Persuade
    - name: Earnings call preparation
      description: Draft the talking points and likely analyst questions for the earnings call.
      label: Persuade
    - name: Funding approvals
      description: Recommend approval or rejection of each funding request, and answer for the call.
      onet_id: 3399
      label: Own
    - name: Bank and auditor relationships
      description: Own the company's day-to-day relationships with its banks and outside auditors.
      onet_id: 8864
      label: Own
    - name: Financing decision
      description: Decide with the CFO whether to fund an expansion from cash on hand or new debt.
      onet_id: 8870
      label: Own
- slug: finance-faculty
  title: Finance Faculty
  onet_code: "25-1011.00"
  onet_title: Business Teachers, Postsecondary
  summary: >-
    This is the task map for my own job as a finance professor at Columbia Business School. The job
    has two halves: producing research papers, and teaching MBA and PhD students. Notice that grading
    shows up twice, because scoring an exam and deciding a final grade are different kinds of work.
  tasks:
    - name: Building research datasets
      description: Pull stock prices, fund holdings, and insurance company filings from databases and merge them into one research panel.
      onet_id: 5681
      label: Process
    - name: Literature review
      description: Find and summarize the existing papers related to a new research idea.
      onet_id: 5670
      label: Process
    - name: Scoring exams
      description: Score students' exam answers against the answer key and the grading rubric.
      onet_id: 5664
      label: Process
    - name: Picking research ideas
      description: Choose which of several research ideas is worth two years of work, a call of taste with no right answer.
      onet_id: 5681
      label: Own
    - name: Empirical estimation
      description: Estimate from data how much investor demand moves asset prices, a number nobody knows in advance.
      onet_id: 5681
      label: Predict
    - name: Anticipating referees
      description: Forecast the objections referees and editors will raise, and fix the paper before it is submitted.
      onet_id: 5681
      label: Predict
    - name: Writing papers
      description: Write the paper so that referees and readers are convinced the result is right and important.
      onet_id: 5681
      label: Persuade
    - name: Seminar presentations
      description: Present research at other universities and conferences, and defend it against questions.
      onet_id: 5670
      label: Persuade
    - name: Lecturing
      description: Teach a class session that changes how students think about a topic.
      onet_id: 5662
      label: Persuade
    - name: Refereeing
      description: Recommend whether a journal should accept or reject another researcher's paper, and stand behind the report.
      label: Own
    - name: Final course grades
      description: Decide each student's final grade and answer for it if the student appeals.
      onet_id: 5663
      label: Own
    - name: Advising PhD students
      description: Own the relationship with PhD students and answer for their progress toward the job market.
      onet_id: 5680
      label: Own
