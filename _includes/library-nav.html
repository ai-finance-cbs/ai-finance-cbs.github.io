<nav class="subnav{{ include.where }}" aria-label="Library sections">
  <ul>
    {% for s in site.data.library %}
    {% capture u %}/library/{{ s.slug }}/{% endcapture %}
    <li><a href="{{ u | relative_url }}"{% if page.url == u %} aria-current="page"{% endif %}><span class="subnav-kicker">{{ s.kicker }}</span><span class="subnav-label">{{ s.title }}</span></a></li>
    {% endfor %}
  </ul>
</nav>
