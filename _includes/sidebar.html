<!-- Top bar: school logo and course name, always visible. -->
<header class="topbar">
  <!-- Phones show only the CBS mark; wider screens show the full logo. -->
  <picture class="cbs-logo">
    <source media="(max-width: 819px)" srcset="{{ '/assets/cbs-mark.png' | relative_url }}">
    <img src="{{ '/assets/cbs-logo.png' | relative_url }}" alt="Columbia Business School">
  </picture>
  <a class="course-brand" href="{{ '/' | relative_url }}"><span class="brand-title">B8403: Finance in the Age of AI</span><span class="brand-term">Spring 2027</span></a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar-panel"><span>Menu</span><span class="menu-icon" aria-hidden="true"></span></button>
</header>
<!-- Left pane: page links only. -->
<aside class="site-sidebar">
  <div class="sidebar-panel" id="sidebar-panel">
    <nav aria-label="Course pages">
      <ul class="nav-list">
        {% for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <div class="sidebar-resources">
      <!-- TODO: Replace these two URLs when the course links are confirmed. -->
      <a class="resource-link" href="#" data-pending aria-disabled="true" aria-label="Canvas — link to be announced"><span>Canvas</span><span class="link-status">Link TBA</span></a>
      <a class="resource-link" href="#" data-pending aria-disabled="true" aria-label="Office hours — link to be announced"><span>Office hours</span><span class="link-status">Link TBA</span></a>
    </div>
    <div class="sidebar-instructor">
      <p>Instructor: Simon Oh</p>
      <p><a href="mailto:oh@gsb.columbia.edu">oh@gsb.columbia.edu</a></p>
    </div>
  </div>
</aside>
