<nav class="subnav{{ include.where }}" aria-label="Syllabus sections">
  <ul>
    {% assign syl = 'Course Goals|/syllabus/,Technology|/syllabus/technology/,Tentative Schedule|/syllabus/tentative-schedule/' | split: ',' %}
    {% for s in syl %}{% assign p = s | split: '|' %}
    <li><a href="{{ p[1] | relative_url }}"{% if page.url == p[1] %} aria-current="page"{% endif %}><span class="subnav-label">{{ p[0] }}</span></a></li>
    {% endfor %}
  </ul>
</nav>
