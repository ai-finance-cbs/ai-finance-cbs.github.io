<dialog id="materials-login" class="login-dialog" aria-labelledby="login-title">
  <button class="dialog-close" type="button" data-close-login aria-label="Close sign-in">Close</button>
  <p class="login-course">B8403: Finance in the Age of AI · Spring 2027</p>
  <h2 id="login-title">Course Materials</h2>
  <p data-login-intro>Sign in with your Columbia Google account. Only @columbia.edu and @gsb.columbia.edu accounts are accepted.</p>
  <div data-login-step>
    <div class="gsi-slot" data-gsi hidden></div>
    <button class="materials-button primary" type="button" data-google>Continue with Columbia Google</button>
    <button class="gsi-fallback" type="button" data-google-fallback hidden>Trouble signing in? Use the other sign-in page</button>
    <p class="uni-note">Using @gsb.columbia.edu? The instructor must link your email to your roster UNI.</p>
  </div>
  <p data-login-message role="status" aria-live="polite"></p>
  <!-- Shown instead of the sign-in screen when Google sign-in worked but the account has no course access. -->
  <div class="login-denied" data-denied role="alert" hidden>
    <img src="{{ '/assets/loader-clip.png' | relative_url }}" alt="" width="112" height="112">
    <p class="clip-bubble" id="denied-text" data-denied-text></p>
    <button class="materials-button" type="button" data-denied-retry>Use a different account</button>
  </div>
  <fieldset class="demo-controls" data-demo-controls hidden>
    <legend>Local demo · synthetic data</legend>
    <label for="demo-role">Preview role</label>
    <select id="demo-role"><option value="instructor">Instructor</option><option value="grader">Grader</option><option value="student">Student</option><option value="auditor">Auditor</option><option value="unlisted">Unlisted</option><option value="gsb">First-time CBS student</option><option value="test">Test student</option></select>
    <button type="button" class="materials-button" data-demo-enter>Use demo role</button>
  </fieldset>
</dialog>
