{% assign m = include.m %}<li class="material" data-level="{{ m.level }}"><span class="material-kind">{{ m.kind }}</span><span class="material-body">{% if m.level == 'required' %}<span class="badge-required">Required</span>{% endif %}{% if m.url %}<a href="{{ m.url }}">{{ m.title }}</a>{% else %}{{ m.title }}{% endif %}{% if m.source %}<span class="material-source">{{ m.source }}</span>{% endif %}{% if m.note %}<span class="material-note">{{ m.note }}</span>{% endif %}</span></li>
