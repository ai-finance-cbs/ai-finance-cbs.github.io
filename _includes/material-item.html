{% assign m = include.m %}<li class="material" data-level="{{ m.level }}">{% if m.level == 'required' %}<span class="badge-required">Required</span>{% endif %}{% if m.url %}<a href="{{ m.url }}">{{ m.title }}</a>{% else %}{{ m.title }}{% endif %}<span class="material-source">{{ m.kind }}{% if m.source %} · {{ m.source }}{% endif %}</span>{% if m.note %}<span class="material-note">{{ m.note }}</span>{% endif %}</li>
